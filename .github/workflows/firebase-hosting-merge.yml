# Deploys the app to https://jacquengel-pos.web.app on every push to main.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT_JACQUENGEL_POS (see README).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JACQUENGEL_POS }}
          channelId: live
          projectId: jacquengel-pos
